; LXQt panel configuration (system-wide default, installed to /etc/xdg/lxqt/panel.conf)
;
; Based on the Webtop ubuntu-lxqt default.

panels=panel1

[panel1]
; Plugins shown on the panel, in order from left to right.
; Remove a name here to remove that item from the panel.
;   fancymenu       main application menu
;   quicklaunch     launcher icons (configured in [quicklaunch])
;   taskbar         buttons for open windows
;   statusnotifier  application status icons
;   tray            system tray
;   volume          volume control
;   clock           clock
;   showdesktop     "show desktop" button
plugins=fancymenu, quicklaunch, taskbar, statusnotifier, tray, volume, clock, showdesktop
; Screen edge the panel sits on.
position=Bottom
; Screen number (0 = first/only screen).
desktop=0
; Auto-hide: the panel slides away and reappears when the pointer touches the screen edge.
; (Untested on the Wayland/labwc session used by this image.)
hidable=true
; Don't reserve screen space for the panel, so windows can use the full area.
reserve-space=false

[fancymenu]
; Main menu button.
type=fancymenu
alignment=Left
; Menu icon from the Selkies theme shipped with the base image.
icon=/usr/share/lxqt/themes/selkies/mainmenu.svg
; Clear the search filter when the menu is closed.
filterClear=true
; Automatically select the first search match, after the delay below (milliseconds).
autoSel=true
autoSelDelay=150

; Launcher area.
; The upstream defaults (Chromium, terminal, file manager) are removed;
; only LyX is listed. Add more entries by raising 'size' and adding
; apps\2\desktop, apps\3\desktop, ... lines pointing to .desktop files.
[quicklaunch]
type=quicklaunch
alignment=Left
; Number of launcher entries.
apps\size=1
apps\1\desktop=/usr/share/applications/lyx.desktop

[taskbar]
; One button per open window.
type=taskbar
; Maximum button width in pixels.
buttonWidth=220
; Close a window with a middle click on its button.
closeOnMiddleClick=true
; Don't group windows of the same application into one button.
groupingEnabled=false

[statusnotifier]
; Status icons that applications register (modern replacement for the old tray).
type=statusnotifier
alignment=Right

[tray]
; Classic system tray area.
type=tray

[volume]
; Volume control; device=0 uses the first audio device.
type=volume
device=0

[clock]
type=clock

[showdesktop]
; Button that minimizes all windows to reveal the desktop.
type=showdesktop
alignment=Right